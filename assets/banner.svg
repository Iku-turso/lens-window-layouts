<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c6fa3"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <g id="bar">
      <circle cx="0" cy="0" r="5" fill="#ff5f57"/>
      <circle cx="16" cy="0" r="5" fill="#febc2e"/>
      <circle cx="32" cy="0" r="5" fill="#28c840"/>
    </g>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>

  <!-- Two screens side by side, their windows tiled -->
  <g transform="translate(150 150)">
    <rect width="440" height="260" rx="14" fill="#0f1b2b" stroke="#5aa9e6" stroke-width="4"/>
    <rect x="16" y="16" width="200" height="228" rx="8" fill="#ffffff"/>
    <rect x="16" y="16" width="200" height="26" rx="8" fill="#dbe8f4"/>
    <use href="#bar" x="32" y="29"/>
    <rect x="228" y="16" width="196" height="108" rx="8" fill="#ffffff"/>
    <rect x="228" y="16" width="196" height="26" rx="8" fill="#dbe8f4"/>
    <use href="#bar" x="244" y="29"/>
    <rect x="228" y="136" width="196" height="108" rx="8" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="228" y="136" width="196" height="26" rx="8" fill="#dbe8f4" fill-opacity="0.75"/>
    <use href="#bar" x="244" y="149"/>
    <rect x="190" y="268" width="60" height="22" fill="#5aa9e6"/>
    <rect x="150" y="288" width="140" height="10" rx="5" fill="#5aa9e6"/>
  </g>
  <g transform="translate(620 150)">
    <rect width="430" height="260" rx="14" fill="#0f1b2b" stroke="#5aa9e6" stroke-width="4"/>
    <rect x="16" y="16" width="398" height="108" rx="8" fill="#ffffff"/>
    <rect x="16" y="16" width="398" height="26" rx="8" fill="#dbe8f4"/>
    <use href="#bar" x="32" y="29"/>
    <rect x="16" y="136" width="193" height="108" rx="8" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="16" y="136" width="193" height="26" rx="8" fill="#dbe8f4" fill-opacity="0.75"/>
    <use href="#bar" x="32" y="149"/>
    <rect x="221" y="136" width="193" height="108" rx="8" fill="none" stroke="#ff9f43" stroke-width="4" stroke-dasharray="12 8"/>
    <rect x="185" y="268" width="60" height="22" fill="#5aa9e6"/>
    <rect x="145" y="288" width="140" height="10" rx="5" fill="#5aa9e6"/>
  </g>

  <text x="600" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Window Layouts</text>
</svg>
